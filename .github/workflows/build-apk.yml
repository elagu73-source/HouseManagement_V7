name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: curl -fsSLo ../gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
      - run: unzip -q ../gradle.zip -d ..
      - run: ../gradle-8.9/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: house-management-api35-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
